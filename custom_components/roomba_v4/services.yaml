
refresh_map_from_archive:
  name: Refresh map from archive
  fields:
    archive_path:
      required: true
      selector:
        text:
    show_labels:
      required: false
      default: true
      selector:
        boolean:
    show_coverage:
      required: false
      default: true
      selector:
        boolean:

refresh_map_from_url:
  name: Refresh map from URL
  fields:
    url:
      required: true
      selector:
        text:

clear_path_history:
  name: Clear path history
  description: Clear the locally stored robot trail shown on the map.



spot_clean:
  name: Clean a spot
  description: Clean around a chosen point on the robot's active map. Coordinates are in meters, using the map's vacuum coordinate system.
  fields:
    x:
      name: X coordinate (meters)
      required: true
      selector:
        number:
          mode: box
          step: 0.001
    y:
      name: Y coordinate (meters)
      required: true
      selector:
        number:
          mode: box
          step: 0.001
    entry_id:
      required: false
      selector:
        text:

clean_room:
  name: Clean room
  description: Start cleaning a specific mapped room by its room name.
  fields:
    room_name:
      required: true
      selector:
        text:
    entry_id:
      required: false
      selector:
        text:
